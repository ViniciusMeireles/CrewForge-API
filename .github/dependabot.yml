version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: ':arrow_up: build'
      include: scope
    ignore:
      - dependency-name: django
        versions: ['>=5.3']
    groups:
      django:
        patterns:
          - 'django*'
          - 'djangorestframework*'
          - 'drf-*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
